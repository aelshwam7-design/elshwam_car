<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المخزون - الشوام</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#ff7a1a;--ink:#121a30;--muted:#5b6785;--line:#e3e8f2}
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:#f4f6fb;color:var(--ink)}
header{background:#0a1020;color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
main{max-width:900px;margin:24px auto;padding:0 4%}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;margin-bottom:10px}
button{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}
button.ghost{background:transparent;border:1px solid #ffffff55}
.bar{display:flex;gap:10px;margin-bottom:14px}.bar input{margin:0}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row img{width:46px;height:46px;object-fit:contain;background:#f6f8fd;border-radius:8px}
.row .t{flex:1;font-weight:700;font-size:14px}
.sw{position:relative;width:96px;text-align:center;border-radius:999px;padding:7px 0;font-size:13px;font-weight:700;cursor:pointer;user-select:none}
.sw.in{background:#dcfce7;color:#15803d}.sw.out{background:#fee2e2;color:#b91c1c}
.msg{color:#b91c1c;font-size:13px;margin-top:8px}
</style></head>
<body>
<header><strong>إدارة المخزون</strong><button class="ghost" id="logout" style="display:none">تسجيل خروج</button></header>
<main>
 <div id="login" class="box">
  <h3 style="margin-top:0">تسجيل دخول المدير</h3>
  <input id="em" type="email" placeholder="الإيميل" autocomplete="username">
  <input id="pw" type="password" placeholder="الباسورد" autocomplete="current-password">
  <button id="go">دخول</button><div class="msg" id="msg"></div>
 </div>
 <div id="panel" style="display:none">
  <div class="bar"><input id="q" placeholder="ابحث عن منتج..."></div>
  <div class="box" id="list"></div>
 </div>
</main>
<script src="firebase-config.js"></script>

const cfg = window.FIREBASE_CONFIG;
const $ = id => document.getElementById(id);
if (!cfg || !cfg.projectId) { $('msg').textContent = 'املأ بيانات firebase-config.js الأول.'; }
else {
 const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
 const { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
 const { getFirestore, collection, onSnapshot, doc, setDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
 const app = initializeApp(cfg), auth = getAuth(app), db = getFirestore(app);
 const state = {};
 $('go').onclick = () => signInWithEmailAndPassword(auth, $('em').value.trim(), $('pw').value)
   .catch(() => $('msg').textContent = 'الإيميل أو الباسورد غلط.');
 $('logout').onclick = () => signOut(auth);
 function render() {
  const q = $('q').value.trim().toLowerCase();
  $('list').innerHTML = PRODUCTS.filter(p => !q || p.title.toLowerCase().includes(q)).map(p => {
    const out = state[p.id] === false;
    return `<div class="row"><img src="${p.img}" alt=""><div class="t">${p.title}</div>
      <div class="sw ${out ? 'out' : 'in'}" data-id="${p.id}">${out ? 'غير متوفر' : 'متوفر'}</div></div>`;
  }).join('');
 }
 $('q').oninput = render;
 $('list').onclick = e => {
  const el = e.target.closest('.sw'); if (!el) return;
  const id = el.dataset.id, next = state[id] === false;
  setDoc(doc(db, 'stock', id), { inStock: next }).catch(() => alert('مفيش صلاحية. تأكد إنك مسجل دخول.'));
 };
 onAuthStateChanged(auth, u => {
  $('login').style.display = u ? 'none' : ''; $('panel').style.display = u ? '' : 'none';
  $('logout').style.display = u ? '' : 'none';
 });
 onSnapshot(collection(db, 'stock'), s => { s.forEach(d => state[d.id] = d.data().inStock); render(); });
 render();
}
</script></body></html>
